# Runs the SIL tests on every push. Activated in Step 2 (SIL).
name: SIL tests
on: [push, pull_request]

jobs:
  sil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          pip install pytest gcovr

      - name: Static analysis (cppcheck + MISRA)
        run: |
          cppcheck --addon=misra --enable=style --std=c99 --suppress=missingIncludeSystem \
            --suppressions-list=02_SIL/misra_suppressions.txt \
            --error-exitcode=1 -I 02_SIL/src 02_SIL/src/window_ctrl.c

      - name: SIL tests + back-to-back (with coverage)
        run: COVERAGE=1 pytest 02_SIL/tests -v --junitxml=reports/junit.xml

      - name: Coverage report (fails below 90 % lines)
        run: |
          mkdir -p reports/coverage
          gcovr -r . --filter 02_SIL/src/ --fail-under-line 90 build/
          gcovr -r . --filter 02_SIL/src/ --html-details reports/coverage/index.html build/

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sil-reports
          path: reports/